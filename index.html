    <script>
      // Polyfill/shim to allow reassigning window.fetch in environments where Window.prototype.fetch has only a getter
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: desc.get || function() { return currentFetch; },
                  set: function(newFetch) {
                    currentFetch = newFetch;
                  }
                });
              }
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
